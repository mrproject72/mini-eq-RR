[package]
name = "mini-eq-rr"
version = "0.10.0"
edition = "2024"
description = "mini-eq RR — Rust rewrite of the mini-eq PipeWire system-wide parametric equalizer."
license = "GPL-3.0-or-later"
authors = ["mrproject72"]
keywords = ["audio", "desktop", "equalizer", "pipewire", "gtk", "linux", "parametric-eq"]
categories = ["audio", "gui", "multimedia"]
readme = "README.md"
repository = "https://github.com/mrproject72/mini-eq-RR"

[dependencies]
libc = "0.2"
# PipeWire
pipewire = "0.10.1"
pipewire-sys = "0.10.1"
pipewire-native = "0.1.4"

# GTK4 / Libadwaita UI
gtk4 = "0.11.4"
cairo-rs = "0.18"
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4", "v1_5"] }
gio = { version = "0.22.9", features = ["v2_80"] }
glib = "0.22.9"
pango = "0.22.9"

# CLI
clap = { version = "4.6.7", features = ["derive"] }

# Async runtime
tokio = { version = "1.53.1", features = ["full"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

# D-Bus
dbus = "0.9.12"

# FFT
rustfft = "6.4.1"
num-complex = "0.4"

# Loudness
ebur128 = "0.1.10"

# System utilities
nix = { version = "0.31.3", features = ["fs", "process", "socket", "poll"] }

# Logging
log = "0.4"
env_logger = "0.11"

# File I/O
dirs = "5.0"
anyhow = "1"
thiserror = "1"

# Parsing / networking
regex = "1.13"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }

[build-dependencies]

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
