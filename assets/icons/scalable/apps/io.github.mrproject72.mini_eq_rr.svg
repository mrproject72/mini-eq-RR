<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mini EQ RR application icon.

  Depicts a parametric equalizer response curve over a frequency grid, using the
  same two colours the app itself draws with: the curve green
  (rgb(0, 0.8, 0)) from window_graph.rs and the accent blue
  (rgb(120, 160, 220)) from the accent-color variable in style.rs.

  This file exists because desktop_integration.rs pointed
  APP_ICON_SEARCH_PATH at "assets/icons", which did not exist — so
  `copy_app_icons` returned early, installed nothing, and every generated
  .desktop file declared an Icon= that resolved to no file at all.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4256"/>
      <stop offset="1" stop-color="#232936"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78a0dc"/>
      <stop offset="0.5" stop-color="#66e066"/>
      <stop offset="1" stop-color="#78a0dc"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="25.5" fill="none"
        stroke="#78a0dc" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Frequency grid -->
  <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round">
    <line x1="24" y1="38" x2="104" y2="38"/>
    <line x1="24" y1="64" x2="104" y2="64"/>
    <line x1="24" y1="90" x2="104" y2="90"/>
    <line x1="42" y1="28" x2="42" y2="100"/>
    <line x1="64" y1="28" x2="64" y2="100"/>
    <line x1="86" y1="28" x2="86" y2="100"/>
  </g>

  <!-- Response curve: a bass lift, a presence dip, a treble lift. -->
  <path d="M24 78
           C 34 78, 38 44, 52 44
           C 64 44, 68 84, 80 84
           C 92 84, 96 52, 104 52"
        fill="none" stroke="url(#curve)" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Band nodes -->
  <g fill="#eaf2ff" stroke="#232936" stroke-width="3">
    <circle cx="42" cy="52" r="7"/>
    <circle cx="64" cy="64" r="7"/>
    <circle cx="86" cy="76" r="7"/>
  </g>
</svg>