name: CI

# Least privilege. This workflow only reads the repository (actions/checkout)
# and never needs to write contents, packages or security events. Without an
# explicit block the GITHUB_TOKEN inherits the repository's default --
# potentially broad -- permissions, which CodeQL flags.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgraphene-1.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libdbus-1-dev \
            libssl-dev \
            pkg-config
      - name: Check icons are reproducible and not banded
        run: |
          sudo apt-get install -y python3-numpy
          python3 assets/generate-icons.py --check

      - name: Check format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Check
        run: cargo check --release
      - name: Test
        run: cargo test --lib
      - name: Build
        run: cargo build --release
